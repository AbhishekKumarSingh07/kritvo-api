# Local development only. Start: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kritvo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first startup only, as the postgres superuser: creates the
      # kritvo_owner / kritvo_app / kritvo_system roles (LLD section 2.1).
      - ./scripts/bootstrap-db.sql:/docker-entrypoint-initdb.d/bootstrap-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kritvo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      APP_ENV: local
      LOG_LEVEL: DEBUG
      # kritvo_app: NOBYPASSRLS, so local dev exercises the same tenant isolation as
      # production. Migrations run separately, as kritvo_owner — see the README.
      DATABASE_URL: postgresql+asyncpg://kritvo_app:change-me@db:5432/kritvo
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build: .
    command: ["uvicorn", "kritvo.main_gateway:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      APP_ENV: local
      LOG_LEVEL: DEBUG
    ports:
      - "8001:8001"

volumes:
  pgdata:

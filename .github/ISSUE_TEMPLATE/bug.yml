name: Bug
description: Something does not work as designed
title: "bug: "
labels: ["type:fix"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen (with HLD/LLD reference if any)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: Environment and version
      placeholder: staging, v0.1.0, Android 13, WhatsApp
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Critical, Major, Minor]

name: Decision needed
description: A question that blocks work and may need an ADR
title: "decision: "
labels: ["needs-decision"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options and trade-offs
  - type: input
    id: blocks
    attributes:
      label: Blocks
      placeholder: TASK-013
  - type: input
    id: due
    attributes:
      label: Decide by (YYYY-MM-DD)

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run lint-imports
      - run: uv run pytest -q

      - name: Container image builds
        run: docker build --tag kritvo-api:ci .

      - name: OpenAPI contract is up to date
        run: |
          uv run kritvo-openapi
          git diff --exit-code -- openapi/openapi.json \
            || { echo "::error file=openapi/openapi.json::Stale contract. Run 'uv run kritvo-openapi' and commit."; exit 1; }

  # Terraform fmt/validate arrives with TASK-020.

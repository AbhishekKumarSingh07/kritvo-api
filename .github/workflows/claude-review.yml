name: claude-review

# Runs only on PRs labelled "claude-review", to control API cost.
# Setup: in Claude Code run /install-github-app, or add the ANTHROPIC_API_KEY repository secret.

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review]

jobs:
  review:
    if: contains(github.event.pull_request.labels.*.name, 'claude-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for Kritvo. The PR branch is checked out.
            Use CLAUDE.md, docs/engineering/CODING_STANDARDS.md and
            docs/engineering/DEFINITION_OF_DONE.md as the standard, and the HLD/LLD
            sections named in the PR description as the design reference.

            Focus on, in order: tenant isolation (RLS, tenant_id handling), security
            (injection, authorisation, secrets, input validation), correctness and edge
            cases, idempotency, error handling, performance (N+1 queries), tests, and
            whether code and docs still agree.

            Post one top-level comment with `gh pr comment` containing:
            1. Verdict: ✅ Good to go / ⚠️ Needs changes / ❌ Significant issues
            2. A findings table: # | Severity (🔴 Critical, 🟠 Major, 🟡 Minor, 🔵 Nit) | Location | Category | Issue | Suggested fix
            3. Documentation impact, if any.
            Use inline comments for specific lines. Only post GitHub comments.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

[project]
name = "kritvo"
version = "0.1.0"
description = "Kritvo backend: FastAPI API, WhatsApp gateway and worker"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.141",
  "uvicorn[standard]>=0.53",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.31",
  "alembic>=1.20",
  "python-dotenv>=1.2",
  "argon2-cffi>=25.1.0",
  "pyjwt[crypto]>=2.14.0",
  "pyotp>=2.10.0",
]

[project.scripts]
kritvo-openapi = "kritvo.tools.openapi:main"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "httpx>=0.28",
  "ruff>=0.16",
  "mypy>=2.3",
  "import-linter>=2.15",
  "testcontainers[postgres]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kritvo"]

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["docs", "openapi"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # import order
  "B",             # bugbear
  "UP",            # modern Python syntax
  "N",             # naming
  "S",             # security (bandit rules)
  "ASYNC",         # blocking calls in async code
  "DTZ",           # timezone-aware datetimes only
  "SIM",           # simplifications
  "T20",           # no print()
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# ---------- import-linter ----------
# Module boundaries from LLD 1.3.
[tool.importlinter]
root_package = "kritvo"

[[tool.importlinter.contracts]]
name = "core and shared never import feature modules"
type = "forbidden"
source_modules = ["kritvo.core", "kritvo.shared"]
forbidden_modules = ["kritvo.modules", "kritvo.main_api", "kritvo.main_gateway"]

[[tool.importlinter.contracts]]
name = "feature modules are independent"
type = "independence"
modules = ["kritvo.modules.identity", "kritvo.modules.notifications"]
ignore_imports = ["kritvo.modules.identity.* -> kritvo.modules.notifications.interface"]

[[tool.importlinter.contracts]]
name = "identity depends on the notification interface only, never a concrete sender"
type = "forbidden"
source_modules = ["kritvo.modules.identity"]
forbidden_modules = ["kritvo.modules.notifications.senders", "kritvo.modules.notifications.registry"]
